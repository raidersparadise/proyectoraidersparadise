      rel="stylesheet"

    <link

      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"

    />
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }

      .glass-panel {
        background: rgba(32, 31, 34, 0.4);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .glass-input {
        background: rgba(19, 19, 22, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(145, 144, 153, 0.2);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .glass-input:focus {
        border-color: #554395;
        box-shadow: 0 0 15px rgba(85, 67, 149, 0.3);
        outline: none;
      }

      .btn-primary-gradient {
        background: linear-gradient(135deg, #ff6b00 0%, #ff3d00 100%);
        transition:
          transform 0.2s ease,
          opacity 0.3s ease;
      }

      .btn-primary-gradient:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      .btn-primary-gradient:active {
        transform: scale(0.98);
      }

      body {
        font-family: "Montserrat", sans-serif;
        background-color: #131316;
        overflow-x: hidden;
      }

      .animated-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background: radial-gradient(
          circle at 50% 50%,
          #1e2247 0%,
          #131316 100%
        );
      }
    </style>

  <body
    class="min-h-screen flex items-center justify-center p-6 text-on-surface"
  >
    <div class="animated-bg"></div>
    <main class="w-full max-w-md">
      <!-- Logo Section -->
      <div class="flex flex-col items-center mb-12">
        <h1
          class="font-display-lg text-display-lg-mobile md:text-display-lg italic font-black text-primary tracking-widest uppercase mb-2"
        >
          RaidersParadise
        </h1>
        <p
          class="font-label-md text-label-md text-secondary tracking-[0.4em] uppercase"
        >
          Engineering Excellence
        </p>
      </div>
      <!-- Login Card -->
      <div
        class="glass-panel p-8 md:p-10 rounded-xl shadow-2xl relative overflow-hidden"
      >
        <!-- Decorative Accent -->
        <div
          class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-secondary/30 to-transparent"
        ></div>
        <form class="space-y-6">
          <div>
            <label
              class="block font-label-md text-label-md text-on-surface-variant uppercase mb-2"
              for="email"
              >Correo Electrónico</label
            >
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50"
                >mail</span
              >
              <input
                class="glass-input w-full py-4 pl-12 pr-4 rounded-lg text-on-surface font-body-md placeholder:text-on-surface-variant/30"
                id="email"
                placeholder="usuario@apexmoto.com"
                type="email"
              />
            </div>
          </div>
          <div>
            <label
              class="block font-label-md text-label-md text-on-surface-variant uppercase mb-2"
              for="password"
              >Contraseña</label
            >
            <div class="relative">
              <span
                class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50"
                >lock</span
              >
              <input
                class="glass-input w-full py-4 pl-12 pr-4 rounded-lg text-on-surface font-body-md placeholder:text-on-surface-variant/30"
                id="password"
                placeholder="••••••••"
                type="password"
              />
            </div>
          </div>
          <div class="flex justify-end">
            <a
              class="font-label-md text-label-md text-secondary hover:text-primary transition-colors"
              href="#"
              >¿Olvidaste tu contraseña?</a
            >
          </div>
          <button
            class="btn-primary-gradient w-full py-5 rounded-lg font-headline-md text-headline-md text-white uppercase tracking-widest shadow-lg shadow-orange-900/20"
            type="submit"
          >
            INICIAR SESIÓN
          </button>
          <!-- Social Login Divider -->
          <div class="flex items-center gap-4 my-8">
            <div class="h-px flex-1 bg-white/10"></div>
            <span class="font-label-md text-label-md text-on-surface-variant/40"
              >O CONTINUAR CON</span
            >
            <div class="h-px flex-1 bg-white/10"></div>
          </div>
          <!-- Social Buttons -->
          <div class="grid grid-cols-2 gap-4">
            <button
              class="glass-input py-3 rounded-lg flex items-center justify-center gap-3 hover:bg-white/5 transition-all group"
              type="button"
            >
              <div class="w-5 h-5 flex items-center justify-center">
                <svg
                  class="w-full h-full fill-on-surface-variant group-hover:fill-on-surface transition-colors"
                  viewbox="0 0 24 24"
                >
                  <path
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                  ></path>
                  <path
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                  ></path>
                  <path
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                  ></path>
                  <path
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                  ></path>
                </svg>
              </div>
              <span
                class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface"
                >Google</span
              >
            </button>
            <button
              class="glass-input py-3 rounded-lg flex items-center justify-center gap-3 hover:bg-white/5 transition-all group"
              type="button"
            >
              <div class="w-5 h-5 flex items-center justify-center">
                <svg
                  class="w-full h-full fill-on-surface-variant group-hover:fill-on-surface transition-colors"
                  viewbox="0 0 24 24"
                >
                  <path
                    d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C4.31 16.94 3.45 10.12 6.54 7c1.55-1.57 3.51-1.45 4.54-.86 1.09.61 1.76.63 2.87 0 1.03-.58 3.19-.88 4.63.58-2.91 3.38-2.45 8.78.47 11.56-.63 1.54-1.3 1.4-2 2.1zM12.03 7.25c-.21-2.4 1.77-4.43 4.14-4.53.31 2.76-2.67 4.79-4.14 4.53z"
                  ></path>
                </svg>
              </div>
              <span
                class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface"
                >Apple</span
              >
            </button>
          </div>
        </form>
      </div>
      <div class="mt-8 text-center">
        <p class="font-body-md text-body-md text-on-surface-variant">
          ¿No tienes una cuenta?
          <a
            class="text-secondary font-semibold hover:text-primary transition-colors ml-1"
            href="#"
            >Crear una cuenta</a
          >
        </p>
      </div>
    </main>
    <!-- Interactive Background Particles -->
    <script>
      document.addEventListener("mousemove", (e) => {
        const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
        const moveY = (e.clientY - window.innerHeight / 2) * 0.01;

        const bg = document.querySelector(".animated-bg");
        bg.style.transform = `translate(${moveX}px, ${moveY}px)`;
      });

      // Form Focus Effects
      const inputs = document.querySelectorAll("input");
      inputs.forEach((input) => {
        input.addEventListener("focus", () => {
          input.parentElement.parentElement.classList.add("scale-[1.02]");
        });
        input.addEventListener("blur", () => {
          input.parentElement.parentElement.classList.remove("scale-[1.02]");
        });
      });
    </script>
  </body>
