        }
        .input-focus-glow:focus {
            outline: none;
            border-color: #554395;
            box-shadow: 0 0 10px rgba(85, 67, 149, 0.4);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

                      "tertiary-container": "#362100",
                      "primary": "#c0c3f2",
                      "on-surface": "#e5e1e5",
                      "on-error": "#690005",
                      "surface-bright": "#39393c",
                      "surface-container-low": "#1b1b1e",

<body class="bg-background min-h-screen flex flex-col items-center">
<!-- Background Atmospheric Layer -->
<div class="fixed inset-0 z-[-1] opacity-40">

</div>
<!-- Header Navigation Shell (Transactional Mode - Minimal) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center h-20 px-margin-mobile md:px-margin-desktop bg-surface/40 backdrop-blur-md border-b border-white/5">
<div class="flex items-center gap-2">
<span class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg font-black italic text-primary uppercase tracking-widest scale-75 origin-left">
                RaidersParadise
            </span>
</div>
<div class="hidden md:flex gap-gutter">
<a class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant hover:text-primary transition-colors" href="#">Engineering</a>
<a class="font-label-md text-label-md uppercase tracking-widest text-on-surface-variant hover:text-primary transition-colors" href="#">Fleet</a>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow w-full flex items-center justify-center pt-24 pb-12 px-margin-mobile">
<div class="w-full max-w-[540px] animate-in fade-in slide-in-from-bottom-8 duration-1000">
<!-- Title Section -->
<div class="text-center mb-10">
<h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background mb-4 text-glow">
                    Únete a la Élite
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[420px] mx-auto leading-relaxed opacity-80">
                    Crea tu cuenta para acceder a beneficios exclusivos y personalización de alto rendimiento.
                </p>
</div>
<!-- Glassmorphism Form Container -->
<div class="glass-panel p-8 md:p-12 rounded-xl shadow-2xl space-y-6">
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant opacity-60 ml-1">Nombre Completo</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">person</span>
<input class="w-full bg-surface-container-lowest border border-white/10 rounded-lg py-4 pl-12 pr-4 font-body-md text-on-surface placeholder:opacity-30 input-focus-glow transition-all" placeholder="John Doe" type="text">
</div>
</div>
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant opacity-60 ml-1">Correo Electrónico</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-surface-container-lowest border border-white/10 rounded-lg py-4 pl-12 pr-4 font-body-md text-on-surface placeholder:opacity-30 input-focus-glow transition-all" placeholder="email@apexmoto.com" type="email">
</div>
</div>
<!-- Password Fields Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="space-y-2">
<label class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant opacity-60 ml-1">Contraseña</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container-lowest border border-white/10 rounded-lg py-4 pl-12 pr-4 font-body-md text-on-surface placeholder:opacity-30 input-focus-glow transition-all" placeholder="••••••••" type="password">
</div>
</div>
<div class="space-y-2">
<label class="font-label-md text-label-md uppercase tracking-wider text-on-surface-variant opacity-60 ml-1">Confirmar</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">shield_lock</span>
<input class="w-full bg-surface-container-lowest border border-white/10 rounded-lg py-4 pl-12 pr-4 font-body-md text-on-surface placeholder:opacity-30 input-focus-glow transition-all" placeholder="••••••••" type="password">
</div>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 py-2">
<input class="mt-1 w-5 h-5 rounded border-white/20 bg-surface-container-lowest text-primary focus:ring-primary focus:ring-offset-background transition-all" id="terms" type="checkbox">
<label class="font-label-md text-label-md text-on-surface-variant leading-snug cursor-pointer select-none" for="terms">
                            Acepto los <a class="text-primary hover:underline transition-all" href="#">Términos</a> y la <a class="text-primary hover:underline transition-all" href="#">Política de Privacidad</a> de Apex Moto.
                        </label>
</div>
<!-- Primary Action -->
<button class="orange-gradient w-full py-5 rounded-lg font-label-md text-label-md text-white font-bold uppercase tracking-[0.2em] shadow-[0_10px_20px_rgba(255,61,0,0.3)] hover:shadow-[0_15px_30px_rgba(255,61,0,0.5)] active:scale-[0.98] transition-all">
                        CREAR CUENTA
                    </button>
</form>
<!-- Divider -->

<!-- Social Sign Up -->

</div>
<!-- Footer Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant opacity-60">
                    ¿Ya tienes cuenta? 
                    <a class="font-bold text-primary hover:text-white transition-colors ml-2" href="login.html">Inicia Sesión</a>
</p>
</div>
</div>
</main>
<!-- Decorative Corner Element -->
<div class="fixed bottom-0 right-0 p-8 hidden lg:block opacity-20 hover:opacity-50 transition-opacity">
<div class="flex flex-col items-end">
<span class="font-label-md text-label-md uppercase tracking-tighter text-primary">Precision Crafted</span>
<span class="font-display-lg-mobile text-display-lg-mobile font-black italic text-on-surface uppercase tracking-widest opacity-30">V.24</span>
</div>
</div>
<!-- Interaction Script -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
                input.parentElement.parentElement.classList.add('transition-transform');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>


</body></html>
